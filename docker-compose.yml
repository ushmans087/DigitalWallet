services:

  discovery-server:
    image: discovery-server:latest
    container_name: discovery-server

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/eureka/apps"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka:
    image: apache/kafka:latest
    container_name: kafka

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s


  redis:
    image: redis:latest
    container_name: redis

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${{password_for_root}}
      MYSQL_USER: ${{new_user}}
      MYSQL_PASSWORD: ${{password_for_new_user}}

    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${{password_for_user}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  auth-server:
    image: auth-server:latest
    container_name: auth-server

    depends_on:
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy


  wallet-server:
    image: wallet-server:latest
    container_name: wallet-server

    depends_on:
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy


  payment-server:
    image: payment-server:latest
    container_name: payment-server

    depends_on:
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy


  api-gateway:
    image: api-gateway:latest
    container_name: api-gateway

    ports:
      - "8080:8080"

    depends_on:
      discovery-server:
        condition: service_healthy
      wallet-server:
        condition: service_started
      payment-server:
        condition: service_started
      auth-server:
        condition: service_started

volumes:
    redis-data:
    kafka-data:
    mysql-data:
