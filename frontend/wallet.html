<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Wallet - Wallet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-logo">WALLET.IO</div>
        <ul class="nav-links">
            <li class="nav-item"><a href="dashboard.html" class="nav-link">Dashboard</a></li>
            <li class="nav-item"><a href="wallet.html" class="nav-link">Wallet</a></li>
            <li class="nav-item"><a href="bank.html" class="nav-link">Bank</a></li>
            <li class="nav-item"><a href="history.html" class="nav-link">History</a></li>
        </ul>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h1>Wallet</h1>
        
        <div class="card text-center" style="padding: 3rem;">
            <h2 style="color: #aaa; font-weight: 500;">Current Balance</h2>
            <h1 style="font-size: 4rem; margin-bottom: 0;" id="walletBalance">$0.00</h1>
            <p id="walletIdDisplay" style="color: #666; margin-top: 0.5rem;">--</p>
        </div>

        <div class="bank-grid">
            <!-- Transfer to another user -->
            <div class="card">
                <h3>Send Money</h3>
                <form id="sendMoneyForm">
                    <div class="form-group">
                        <label class="form-label">Receiver Wallet ID</label>
                        <input type="number" id="receiverId" class="form-control" placeholder="e.g. 102" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Amount ($)</label>
                        <input type="number" step="0.01" min="0.01" id="sendAmount" class="form-control" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <input type="text" id="sendDescription" class="form-control" placeholder="e.g. Lunch split" required>
                    </div>
                    <p id="sendError" class="error-message"></p>
                    <button type="submit" class="btn" style="width: 100%;">Transfer to Wallet</button>
                </form>
            </div>

            <!-- Transfer between Bank and Wallet -->
            <div class="card">
                <h3>Bank Transfers</h3>
                <form id="bankTransferForm">
                    <div class="form-group">
                        <label class="form-label">Select Bank Account</label>
                        <select id="bankAccountSelect" class="form-control" required>
                            <option value="">Loading accounts...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Amount ($)</label>
                        <input type="number" step="0.01" min="0.01" id="transferAmount" class="form-control" placeholder="0.00" required>
                    </div>
                    <div class="form-group d-flex gap-2 mt-3">
                        <button type="button" class="btn btn-outline" style="flex: 1;" id="btnToWallet">Add to Wallet</button>
                        <button type="button" class="btn btn-outline" style="flex: 1;" id="btnToBank">Send to Bank</button>
                    </div>
                    <p id="bankTransferError" class="error-message"></p>
                </form>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="toast.js"></script>
    <script src="auth.js"></script>
    <script>
        checkAuth();
        let currentBalance = 0;

        async function loadWallet() {
            try {
                const balRes = await apiCall("/wallet/balance");
                if (balRes.ok) {
                    currentBalance = parseFloat(balRes.data);
                    document.getElementById("walletBalance").innerText = `$${currentBalance.toFixed(2)}`;
                }

                // Also fetch wallet ID to display it
                const email = getUserEmail();
                if (email) {
                    const walletRes = await apiCall(`/wallet/findby/email/${email}`);
                    if (walletRes.ok && walletRes.data) {
                        document.getElementById("walletIdDisplay").innerText = `Wallet ID: ${walletRes.data.walletId}`;
                    }
                }

                // Load bank accounts for the dropdown
                const bankRes = await apiCall("/wallet/accounts");
                const select = document.getElementById("bankAccountSelect");
                if (bankRes.ok) {
                    const accounts = bankRes.data || [];
                    if (accounts.length === 0) {
                        select.innerHTML = '<option value="">No bank accounts found</option>';
                    } else {
                        select.innerHTML = '';
                        accounts.forEach(acc => {
                            select.innerHTML += `<option value="${acc.id}">${acc.bankName} (****${acc.accountNumber.toString().slice(-4)})</option>`;
                        });
                    }
                }
            } catch (error) {
                console.error(error);
            }
        }

        document.getElementById("sendMoneyForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById("sendError");
            errorEl.style.display = "none";
            
            const receiverId = document.getElementById("receiverId").value;
            const amount = parseFloat(document.getElementById("sendAmount").value);
            const description = document.getElementById("sendDescription").value;

            if (amount > currentBalance) {
                errorEl.innerText = "Insufficient wallet balance.";
                errorEl.style.display = "block";
                showToast("Insufficient wallet balance.", "warning", "Transfer Failed");
                return;
            }

            try {
                const res = await apiCall("/payment/transfer", {
                    method: "PUT",
                    body: JSON.stringify({
                        receiverWalletId: parseInt(receiverId),
                        amount: amount,
                        description: description
                    })
                });

                if (res.ok) {
                    showToast(`Transfer of <strong>$${amount.toFixed(2)}</strong> sent successfully!`, "success", "Transfer Complete");
                    document.getElementById("sendMoneyForm").reset();
                    loadWallet();
                } else {
                    const failMsg = typeof res.data === 'string' ? res.data : "Transfer failed.";
                    errorEl.innerText = failMsg;
                    errorEl.style.display = "block";
                    showToast(failMsg, "error", "Transfer Failed");
                }
            } catch (error) {
                errorEl.innerText = "Network error.";
                errorEl.style.display = "block";
                showToast("Network error during transfer.", "error", "Connection Error");
            }
        });

        async function handleBankTransfer(isToWallet) {
            const errorEl = document.getElementById("bankTransferError");
            errorEl.style.display = "none";
            
            const accountId = document.getElementById("bankAccountSelect").value;
            const amount = parseFloat(document.getElementById("transferAmount").value);

            if (!accountId) {
                errorEl.innerText = "Please select a bank account.";
                errorEl.style.display = "block";
                showToast("Please select a bank account.", "warning", "Selection Required");
                return;
            }
            if (isNaN(amount) || amount <= 0) {
                errorEl.innerText = "Please enter a valid amount.";
                errorEl.style.display = "block";
                showToast("Please enter a valid amount.", "warning", "Invalid Amount");
                return;
            }

            if (!isToWallet && amount > currentBalance) {
                errorEl.innerText = "Insufficient wallet balance to send to bank.";
                errorEl.style.display = "block";
                showToast("Insufficient wallet balance for this transfer.", "warning", "Insufficient Balance");
                return;
            }

            const endpoint = isToWallet ? "/wallet/transfer/wallet" : "/wallet/transfer/bank";
            
            try {
                const res = await apiCall(endpoint, {
                    method: "POST",
                    body: JSON.stringify({
                        accountId: parseInt(accountId),
                        amount: amount
                    })
                });

                if (res.ok) {
                    showToast(`Bank transfer of <strong>$${amount.toFixed(2)}</strong> completed successfully!`, "success", "Transfer Complete");
                    document.getElementById("bankTransferForm").reset();
                    loadWallet();
                } else {
                    const failMsg = typeof res.data === 'string' ? res.data : "Transfer failed.";
                    errorEl.innerText = failMsg;
                    errorEl.style.display = "block";
                    showToast(failMsg, "error", "Transfer Failed");
                }
            } catch (error) {
                errorEl.innerText = "Network error.";
                errorEl.style.display = "block";
                showToast("Network error during transfer.", "error", "Connection Error");
            }
        }

        document.getElementById("btnToWallet").addEventListener("click", () => handleBankTransfer(true));
        document.getElementById("btnToBank").addEventListener("click", () => handleBankTransfer(false));

        document.addEventListener("DOMContentLoaded", loadWallet);
    </script>
</body>
</html>
