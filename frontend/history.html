<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Wallet - History</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-logo">WALLET.IO</div>
        <ul class="nav-links">
            <li class="nav-item"><a href="dashboard.html" class="nav-link">Dashboard</a></li>
            <li class="nav-item"><a href="wallet.html" class="nav-link">Wallet</a></li>
            <li class="nav-item"><a href="bank.html" class="nav-link">Bank</a></li>
            <li class="nav-item"><a href="history.html" class="nav-link">History</a></li>
        </ul>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h1 class="mb-3">Transaction History</h1>
        <p style="color: #aaa; margin-bottom: 2rem;">View and filter all your wallet transactions by date range.</p>

        <!-- Date Filter Toolbar Card -->
        <div class="filter-card">
            <div class="filter-header">
                <div class="filter-title">
                    <span>📅</span> Date Range Filter
                </div>
                <div id="activeFilterTag" style="display: none;">
                    <span class="active-filter-tag">✓ Filter Active</span>
                </div>
            </div>
            
            <form id="filterForm">
                <div class="filter-grid">
                    <div class="form-group mb-0">
                        <label class="form-label" for="fromDate">From Date</label>
                        <input type="date" id="fromDate" class="form-control">
                    </div>
                    <div class="form-group mb-0">
                        <label class="form-label" for="toDate">To Date</label>
                        <input type="date" id="toDate" class="form-control">
                    </div>
                    <div class="d-flex gap-2 mb-0">
                        <button type="submit" class="btn" style="flex: 1;">Apply Filter</button>
                        <button type="button" id="clearFilterBtn" class="btn btn-outline" style="flex: 1;">Clear</button>
                    </div>
                </div>
            </form>

            <div class="preset-container">
                <span style="font-size: 0.8rem; color: #888; align-self: center; margin-right: 0.25rem;">Quick Presets:</span>
                <button type="button" class="preset-chip" onclick="applyPreset('today')">Today</button>
                <button type="button" class="preset-chip" onclick="applyPreset('7days')">Last 7 Days</button>
                <button type="button" class="preset-chip" onclick="applyPreset('30days')">Last 30 Days</button>
                <button type="button" class="preset-chip" onclick="applyPreset('thisMonth')">This Month</button>
            </div>
        </div>

        <!-- Transactions Container -->
        <div class="card">
            <div id="historyContainer">
                <p>Loading transactions...</p>
            </div>
            <div id="paginationContainer"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="toast.js"></script>
    <script src="auth.js"></script>
    <script>
        checkAuth();

        const container = document.getElementById("historyContainer");
        const activeTag = document.getElementById("activeFilterTag");
        const fromDateInput = document.getElementById("fromDate");
        const toDateInput = document.getElementById("toDate");
        let currentUserId = null;
        let currentWalletId = null;
        let currentUsername = null;

        // Pagination state
        let currentPage = 1;
        let pageSize = 10;
        let totalPages = 1;
        let totalElements = 0;
        let isFilterActive = false;

        function formatForDateInput(date) {
            const pad = (n) => String(n).padStart(2, '0');
            const yyyy = date.getFullYear();
            const mm = pad(date.getMonth() + 1);
            const dd = pad(date.getDate());
            return `${yyyy}-${mm}-${dd}`;
        }

        function formatToIsoLocalDateTime(dateVal, isEndOfDay = false) {
            if (!dateVal) return null;
            const timePart = isEndOfDay ? "23:59:59" : "00:00:00";
            return `${dateVal}T${timePart}`;
        }

        function setDefaultDates() {
            const todayStr = formatForDateInput(new Date());
            fromDateInput.value = todayStr;
            toDateInput.value = todayStr;
        }

        async function fetchCurrentUserInfo() {
            try {
                const email = getUserEmail();
                if (email) {
                    const walletRes = await apiCall(`/wallet/findby/email/${email}`);
                    if (walletRes.ok && walletRes.data) {
                        currentUserId = walletRes.data.userId;
                        currentWalletId = walletRes.data.walletId;
                        currentUsername = walletRes.data.username;
                    }
                }
            } catch (e) {
                console.warn("Could not fetch user info", e);
            }
        }

        function renderTransactions(transactions) {
            if (!transactions || transactions.length === 0) {
                container.innerHTML = "<p style='color:#aaa; text-align:center; padding: 1.5rem 0;'>No transactions found.</p>";
                return;
            }

            // Note: If backend already orders by timestamp desc, this preserves or enforces descending order
            transactions.sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));

            let html = '<ul class="transaction-list">';
            transactions.forEach(tx => {
                const dateStr = tx.timestamp ? new Date(tx.timestamp).toLocaleString() : 'Date Unknown';
                
                // Determine if current user is the sender
                let isSender = false;
                if (currentWalletId && tx.senderWalletId) {
                    isSender = (String(tx.senderWalletId) === String(currentWalletId));
                }
                if (!isSender && currentUsername && tx.senderUsername) {
                    isSender = (tx.senderUsername.trim().toLowerCase() === currentUsername.trim().toLowerCase());
                }
                if (!isSender && currentUserId && tx.receiverId) {
                    isSender = (String(tx.receiverId) === String(currentUserId));
                }

                let partyStr = '';
                let amountSign = '';
                let amountClass = '';

                if (isSender) {
                    const recipient = tx.receiverUsername || (tx.receiverWalletId ? `Wallet #${tx.receiverWalletId}` : 'Recipient');
                    partyStr = `To: ${recipient}`;
                    amountSign = '-';
                    amountClass = 'negative';
                } else {
                    const sender = tx.senderUsername || (tx.senderWalletId ? `Wallet #${tx.senderWalletId}` : 'Sender');
                    partyStr = `From: ${sender}`;
                    amountSign = '+';
                    amountClass = 'positive';
                }

                let statusBadge = '';
                if (tx.status) {
                    const st = tx.status.toUpperCase();
                    let badgeClass = 'badge-pending';
                    if (st === 'SUCCESS' || st === 'COMPLETED' || st === 'APPROVED') badgeClass = 'badge-approved';
                    else if (st === 'FAILED' || st === 'REJECTED') badgeClass = 'badge-rejected';
                    statusBadge = `<span class="badge ${badgeClass}" style="margin-left: 0.5rem;">${st}</span>`;
                }

                html += `
                    <li class="transaction-item">
                        <div class="tx-info">
                            <div class="d-flex align-center">
                                <span class="tx-title">${tx.description || tx.type || 'Transaction'}</span>
                                ${statusBadge}
                            </div>
                            <span class="tx-date" style="margin-top: 2px;">${dateStr}</span>
                            <span class="tx-date">${partyStr}</span>
                        </div>
                        <div class="tx-amount ${amountClass}">${amountSign}$${parseFloat(tx.amount || 0).toFixed(2)}</div>
                    </li>
                `;
            });
            html += '</ul>';
            container.innerHTML = html;
        }

        async function loadHistory(page = 1) {
            currentPage = page;
            isFilterActive = false;
            container.innerHTML = "<p style='color:#aaa;'>Loading transactions...</p>";
            const pagContainer = document.getElementById("paginationContainer");
            if (pagContainer) pagContainer.innerHTML = "";
            activeTag.style.display = "none";
            clearPresetChipsActive();

            if (!currentUserId) {
                await fetchCurrentUserInfo();
            }

            try {
                const res = await apiCall(`/payment/get?pageNumber=${currentPage}&limit=${pageSize}`);
                if (res.ok) {
                    let transactions = [];
                    if (Array.isArray(res.data)) {
                        transactions = res.data;
                        totalPages = 1;
                        totalElements = transactions.length;
                    } else if (res.data && Array.isArray(res.data.content)) {
                        transactions = res.data.content;
                        totalPages = res.data.totalPages || 1;
                        totalElements = res.data.totalElements || transactions.length;
                    } else {
                        transactions = [];
                        totalPages = 1;
                        totalElements = 0;
                    }
                    renderTransactions(transactions);
                    renderPaginationControls();
                } else {
                    container.innerHTML = "<p class='error-message' style='display:block;'>Failed to load history.</p>";
                    if (pagContainer) pagContainer.innerHTML = "";
                }
            } catch (error) {
                console.error(error);
                container.innerHTML = "<p class='error-message' style='display:block;'>Network error loading transactions.</p>";
                if (pagContainer) pagContainer.innerHTML = "";
            }
        }

        function renderPaginationControls() {
            const pagContainer = document.getElementById("paginationContainer");
            if (!pagContainer) return;

            if (isFilterActive || totalElements === 0 || totalPages <= 1) {
                if (isFilterActive && totalElements > 0) {
                    pagContainer.innerHTML = `<div class="pagination-container"><div class="pagination-info"><span>Filter active: Showing ${totalElements} matching transactions</span></div></div>`;
                } else {
                    pagContainer.innerHTML = "";
                }
                return;
            }

            const startItem = (currentPage - 1) * pageSize + 1;
            const endItem = Math.min(currentPage * pageSize, totalElements);

            let pagesHtml = '';
            const prevDisabled = currentPage <= 1 ? 'disabled' : '';
            pagesHtml += `<button class="page-btn" ${prevDisabled} onclick="goToPage(${currentPage - 1})">‹ Prev</button>`;

            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + 4);
            if (endPage - startPage < 4) {
                startPage = Math.max(1, endPage - 4);
            }

            if (startPage > 1) {
                pagesHtml += `<button class="page-btn" onclick="goToPage(1)">1</button>`;
                if (startPage > 2) pagesHtml += `<span style="color:#666; padding:0 0.2rem;">...</span>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                const activeClass = i === currentPage ? 'active' : '';
                pagesHtml += `<button class="page-btn ${activeClass}" onclick="goToPage(${i})">${i}</button>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) pagesHtml += `<span style="color:#666; padding:0 0.2rem;">...</span>`;
                pagesHtml += `<button class="page-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }

            const nextDisabled = currentPage >= totalPages ? 'disabled' : '';
            pagesHtml += `<button class="page-btn" ${nextDisabled} onclick="goToPage(${currentPage + 1})">Next ›</button>`;

            pagContainer.innerHTML = `
                <div class="pagination-container">
                    <div class="pagination-info">
                        <span>Showing ${startItem}–${endItem} of ${totalElements} transactions</span>
                        <label style="margin-left: 0.5rem; display: flex; align-items: center; gap: 0.4rem;">
                            Per page:
                            <select class="pageSize-select" onchange="changePageSize(this.value)">
                                <option value="5" ${pageSize === 5 ? 'selected' : ''}>5</option>
                                <option value="10" ${pageSize === 10 ? 'selected' : ''}>10</option>
                                <option value="20" ${pageSize === 20 ? 'selected' : ''}>20</option>
                                <option value="50" ${pageSize === 50 ? 'selected' : ''}>50</option>
                            </select>
                        </label>
                    </div>
                    <div class="pagination-controls">
                        ${pagesHtml}
                    </div>
                </div>
            `;
        }

        function goToPage(page) {
            if (page < 1 || page > totalPages || page === currentPage) return;
            loadHistory(page);
        }

        function changePageSize(newSize) {
            pageSize = parseInt(newSize, 10) || 10;
            loadHistory(1);
        }

        async function applyFilter(fromDateVal, toDateVal) {
            const fromIso = formatToIsoLocalDateTime(fromDateVal, false);
            const toIso = formatToIsoLocalDateTime(toDateVal, true);

            if (!fromIso || !toIso) {
                showToast("Please select both From Date and To Date.", "warning", "Filter Notice");
                return;
            }

            if (new Date(fromDateVal) > new Date(toDateVal)) {
                showToast("From Date cannot be later than To Date.", "error", "Invalid Range");
                return;
            }

            container.innerHTML = "<p style='color:#aaa;'>Filtering transactions...</p>";
            const pagContainer = document.getElementById("paginationContainer");
            if (pagContainer) pagContainer.innerHTML = "";

            if (!currentUserId) {
                await fetchCurrentUserInfo();
            }

            try {
                const res = await apiCall("/payment/get/filter", {
                    method: "POST",
                    body: JSON.stringify({
                        fromDate: fromIso,
                        toDate: toIso
                    })
                });

                if (res.ok) {
                    isFilterActive = true;
                    activeTag.style.display = "block";
                    let transactions = Array.isArray(res.data) ? res.data : (res.data?.content || []);
                    totalElements = transactions.length;
                    renderTransactions(transactions);
                    renderPaginationControls();
                    showToast(`Showing transactions from ${new Date(fromDateVal).toLocaleDateString()} to ${new Date(toDateVal).toLocaleDateString()}`, "info", "Filter Applied");
                } else {
                    const errorMsg = typeof res.data === 'string' ? res.data : "Failed to fetch filtered transactions.";
                    container.innerHTML = `<p class='error-message' style='display:block;'>${errorMsg}</p>`;
                    showToast(errorMsg, "error", "Filter Failed");
                }
            } catch (error) {
                console.error("Error filtering transactions:", error);
                container.innerHTML = "<p class='error-message' style='display:block;'>Network error filtering transactions.</p>";
                showToast("Network error while filtering transactions.", "error", "Connection Error");
            }
        }

        function clearPresetChipsActive() {
            document.querySelectorAll('.preset-chip').forEach(chip => chip.classList.remove('active'));
        }

        function applyPreset(type) {
            clearPresetChipsActive();
            
            const clickedBtn = event.target;
            if (clickedBtn && clickedBtn.classList.contains('preset-chip')) {
                clickedBtn.classList.add('active');
            }

            const now = new Date();
            let from = new Date();
            let to = new Date();

            if (type === 'today') {
                from = now;
                to = now;
            } else if (type === '7days') {
                from.setDate(now.getDate() - 7);
                to = now;
            } else if (type === '30days') {
                from.setDate(now.getDate() - 30);
                to = now;
            } else if (type === 'thisMonth') {
                from = new Date(now.getFullYear(), now.getMonth(), 1);
                to = now;
            }

            fromDateInput.value = formatForDateInput(from);
            toDateInput.value = formatForDateInput(to);

            applyFilter(fromDateInput.value, toDateInput.value);
        }

        document.getElementById("filterForm").addEventListener("submit", (e) => {
            e.preventDefault();
            clearPresetChipsActive();
            applyFilter(fromDateInput.value, toDateInput.value);
        });

        document.getElementById("clearFilterBtn").addEventListener("click", () => {
            setDefaultDates();
            loadHistory(1);
        });

        document.addEventListener("DOMContentLoaded", () => {
            setDefaultDates();
            loadHistory(1);
        });
    </script>
</body>
</html>
