<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Wallet - Bank</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-logo">WALLET.IO</div>
        <ul class="nav-links">
            <li class="nav-item"><a href="dashboard.html" class="nav-link">Dashboard</a></li>
            <li class="nav-item"><a href="wallet.html" class="nav-link">Wallet</a></li>
            <li class="nav-item"><a href="bank.html" class="nav-link">Bank</a></li>
            <li class="nav-item"><a href="history.html" class="nav-link">History</a></li>
        </ul>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-between align-center mb-4">
            <h1>Bank Accounts</h1>
            <button class="btn" onclick="toggleAddModal()">+ Add Account</button>
        </div>
        
        <div id="accountsGrid" class="bank-grid">
            <p>Loading accounts...</p>
        </div>

        <!-- Add Account Modal -->
        <div id="addAccountModal" class="card" style="display: none; margin-top: 2rem; max-width: 500px;">
            <h3>Add New Bank Account</h3>
            <form id="addAccountForm" class="mt-3">
                <div class="form-group">
                    <label class="form-label">Bank Name</label>
                    <input type="text" id="bankName" class="form-control" placeholder="e.g. Chase Bank" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Account Number</label>
                    <input type="text" id="accountNumber" class="form-control" placeholder="10-16 digit account number" required>
                </div>
                <div class="form-group">
                    <label class="form-label">IFSC Code</label>
                    <input type="text" id="ifscCode" class="form-control" placeholder="e.g. CHAS0123456" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Branch</label>
                    <input type="text" id="branch" class="form-control" placeholder="e.g. Downtown Branch" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Account Type</label>
                    <select id="accountType" class="form-control" required>
                        <option value="Savings">Savings</option>
                        <option value="Checking">Checking</option>
                        <option value="Salary">Salary</option>
                        <option value="Current">Current</option>
                    </select>
                </div>
                <p id="addError" class="error-message"></p>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn">Add Account</button>
                    <button type="button" class="btn btn-outline" onclick="toggleAddModal()">Cancel</button>
                </div>
            </form>
        </div>

        <!-- Deposit/Withdraw Modal -->
        <div id="actionModal" class="card" style="display: none; margin-top: 2rem; max-width: 500px;">
            <h3 id="actionTitle">Perform Action</h3>
            <p id="actionContext" style="color:#aaa; font-size: 0.875rem;" class="mb-3"></p>
            <form id="actionForm">
                <input type="hidden" id="actionAccountId">
                <input type="hidden" id="actionType">
                <div class="form-group">
                    <label class="form-label">Amount ($)</label>
                    <input type="number" step="0.01" min="0.01" id="actionAmount" class="form-control" required>
                </div>
                <p id="actionError" class="error-message"></p>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn" id="actionSubmitBtn">Submit</button>
                    <button type="button" class="btn btn-outline" onclick="closeActionModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="toast.js"></script>
    <script src="auth.js"></script>
    <script>
        checkAuth();
        let bankAccounts = [];

        async function loadBankAccounts() {
            try {
                const res = await apiCall("/wallet/accounts");
                const grid = document.getElementById("accountsGrid");
                
                if (res.ok) {
                    bankAccounts = res.data || [];
                    if (bankAccounts.length === 0) {
                        grid.innerHTML = "<p style='color:#aaa;'>No bank accounts found. Add one to get started.</p>";
                        return;
                    }

                    grid.innerHTML = "";
                    bankAccounts.forEach(acc => {
                        const balance = acc.balance != null ? parseFloat(acc.balance).toFixed(2) : "0.00";
                        const maskedNum = acc.accountNumber ? `****${acc.accountNumber.toString().slice(-4)}` : "****";
                        const verifiedBadge = acc.verified 
                            ? `<span class="badge badge-approved" style="font-size:0.65rem; padding: 0.2rem 0.5rem;">Verified</span>` 
                            : `<span class="badge badge-pending" style="font-size:0.65rem; padding: 0.2rem 0.5rem;">Unverified</span>`;
                        
                        grid.innerHTML += `
                            <div class="atm-card">
                                <div class="d-flex justify-between align-center mb-1">
                                    <div class="d-flex align-center gap-2">
                                        <div class="atm-chip"></div>
                                        <div>
                                            <div style="font-weight:bold; font-size:1rem;">${acc.bankName}</div>
                                            <div style="font-size:0.75rem; color:#aaa;">${acc.accountType || 'Savings'} • ${acc.branch || 'N/A'}</div>
                                        </div>
                                    </div>
                                    ${verifiedBadge}
                                </div>
                                <div class="atm-number my-1">${maskedNum} <span style="font-size:0.75rem; color:#888; font-family:var(--font-family); float:right;">IFSC: ${acc.ifscCode || 'N/A'}</span></div>
                                <div class="atm-details align-center">
                                    <div>
                                        <div style="font-size:0.6rem;">BALANCE</div>
                                        <div style="color:white; font-size:1.05rem; font-weight:600;">$${balance}</div>
                                    </div>
                                    <div class="d-flex gap-2 align-center">
                                        <button class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="openActionModal(${acc.id}, 'deposit')">Dep</button>
                                        <button class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="openActionModal(${acc.id}, 'withdraw')">W/D</button>
                                        <button class="btn btn-danger" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="deleteAccount(${acc.id})">Del</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    grid.innerHTML = "<p class='error-message' style='display:block;'>Failed to load accounts.</p>";
                }
            } catch (error) {
                document.getElementById("accountsGrid").innerHTML = "<p class='error-message' style='display:block;'>Network error.</p>";
            }
        }

        function toggleAddModal() {
            const modal = document.getElementById("addAccountModal");
            modal.style.display = modal.style.display === "none" ? "block" : "none";
            document.getElementById("actionModal").style.display = "none";
            document.getElementById("addError").style.display = "none";
        }

        document.getElementById("addAccountForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const bankName = document.getElementById("bankName").value.trim();
            const accountNumber = document.getElementById("accountNumber").value.trim();
            const ifscCode = document.getElementById("ifscCode").value.trim();
            const branch = document.getElementById("branch").value.trim();
            const accountType = document.getElementById("accountType").value.trim();
            const errorEl = document.getElementById("addError");

            try {
                const res = await apiCall("/wallet/accounts", {
                    method: "POST",
                    body: JSON.stringify({
                        bankName,
                        accountNumber,
                        ifscCode,
                        branch,
                        accountType
                    })
                });

                if (res.ok) {
                    showToast(`Bank account <strong>${bankName}</strong> added successfully!`, "success", "Account Added");
                    document.getElementById("addAccountForm").reset();
                    toggleAddModal();
                    loadBankAccounts();
                } else {
                    const failMsg = (res.data && res.data.message) ? res.data.message : (typeof res.data === 'string' ? res.data : "Failed to add account.");
                    errorEl.innerText = failMsg;
                    errorEl.style.display = "block";
                    showToast(failMsg, "error", "Error");
                }
            } catch (error) {
                errorEl.innerText = "Network error.";
                errorEl.style.display = "block";
                showToast("Network error while adding account.", "error", "Connection Error");
            }
        });

        async function deleteAccount(id) {
            const confirmed = await showConfirm("Are you sure you want to delete this bank account?", "Delete Account");
            if (!confirmed) return;

            try {
                const res = await apiCall(`/wallet/accounts/${id}`, { method: "DELETE" });
                if (res.ok) {
                    showToast("Bank account deleted successfully.", "info", "Account Deleted");
                    loadBankAccounts();
                } else {
                    showToast("Failed to delete bank account.", "error", "Error");
                }
            } catch (error) {
                showToast("Network error while deleting account.", "error", "Connection Error");
            }
        }

        function openActionModal(id, type) {
            const acc = bankAccounts.find(a => a.id === id);
            if (!acc) return;
            
            document.getElementById("addAccountModal").style.display = "none";
            document.getElementById("actionModal").style.display = "block";
            document.getElementById("actionError").style.display = "none";
            document.getElementById("actionForm").reset();

            document.getElementById("actionAccountId").value = id;
            document.getElementById("actionType").value = type;
            
            document.getElementById("actionTitle").innerText = type === 'deposit' ? "Deposit Funds" : "Withdraw Funds";
            document.getElementById("actionContext").innerText = `${acc.bankName} (****${acc.accountNumber.toString().slice(-4)}) - Current Balance: $${parseFloat(acc.balance).toFixed(2)}`;
            document.getElementById("actionSubmitBtn").innerText = type === 'deposit' ? "Deposit" : "Withdraw";
        }

        function closeActionModal() {
            document.getElementById("actionModal").style.display = "none";
        }

        document.getElementById("actionForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById("actionError");
            errorEl.style.display = "none";

            const id = document.getElementById("actionAccountId").value;
            const type = document.getElementById("actionType").value;
            const amount = parseFloat(document.getElementById("actionAmount").value);
            
            const acc = bankAccounts.find(a => a.id == id);

            if (type === 'withdraw' && amount > acc.balance) {
                errorEl.innerText = "Insufficient bank balance for this withdrawal.";
                errorEl.style.display = "block";
                showToast("Insufficient bank balance.", "warning", "Withdrawal Denied");
                return;
            }

            try {
                const res = await apiCall(`/wallet/accounts/${id}/${type}`, {
                    method: "PUT",
                    body: JSON.stringify({ amount })
                });

                if (res.ok) {
                    showToast(`${type === 'deposit' ? 'Deposit' : 'Withdrawal'} of <strong>$${amount.toFixed(2)}</strong> was successful!`, "success", "Transaction Complete");
                    closeActionModal();
                    loadBankAccounts();
                } else {
                    const failMsg = typeof res.data === 'string' ? res.data : "Action failed.";
                    errorEl.innerText = failMsg;
                    errorEl.style.display = "block";
                    showToast(failMsg, "error", "Transaction Failed");
                }
            } catch (error) {
                errorEl.innerText = "Network error.";
                errorEl.style.display = "block";
                showToast("Network error during transaction.", "error", "Connection Error");
            }
        });

        document.addEventListener("DOMContentLoaded", loadBankAccounts);
    </script>
</body>
</html>
