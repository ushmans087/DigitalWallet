<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Wallet - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="justify-content: center; align-items: center; margin-left: 0;">

    <div class="auth-card card">
        <h2 class="text-center mb-1" id="authTitle">Welcome Back</h2>
        <p class="text-center mb-4" style="color: #aaa;" id="authSubtitle">Sign in to your digital wallet</p>

        <form id="authForm">
            <div class="form-group" id="usernameGroup" style="display: none;">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <div id="errorMsg" class="error-message"></div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;" id="submitBtn">Sign In</button>
        </form>

        <div class="text-center mt-3" style="font-size: 0.875rem;">
            <span id="toggleText">Don't have an account? </span>
            <a href="#" id="toggleAuth" style="text-decoration: underline; font-weight: 500;">Register here</a>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="toast.js"></script>
    <script src="auth.js"></script>
    <script>
        // If already logged in, redirect to appropriate page based on role
        if (getToken()) {
            if (isValidator()) {
                window.location.href = "validator.html";
            } else {
                window.location.href = "dashboard.html";
            }
        }

        let isLogin = true;

        const authForm = document.getElementById("authForm");
        const authTitle = document.getElementById("authTitle");
        const authSubtitle = document.getElementById("authSubtitle");
        const submitBtn = document.getElementById("submitBtn");
        const toggleAuth = document.getElementById("toggleAuth");
        const toggleText = document.getElementById("toggleText");
        const usernameGroup = document.getElementById("usernameGroup");
        const errorMsg = document.getElementById("errorMsg");

        toggleAuth.addEventListener("click", (e) => {
            e.preventDefault();
            isLogin = !isLogin;
            errorMsg.style.display = "none";
            
            if (isLogin) {
                authTitle.innerText = "Welcome Back";
                authSubtitle.innerText = "Sign in to your digital wallet";
                submitBtn.innerText = "Sign In";
                toggleText.innerText = "Don't have an account? ";
                toggleAuth.innerText = "Register here";
                usernameGroup.style.display = "none";
                document.getElementById("username").removeAttribute("required");
            } else {
                authTitle.innerText = "Create Account";
                authSubtitle.innerText = "Join our digital wallet platform";
                submitBtn.innerText = "Register";
                toggleText.innerText = "Already have an account? ";
                toggleAuth.innerText = "Sign in";
                usernameGroup.style.display = "block";
                document.getElementById("username").setAttribute("required", "true");
            }
        });

        authForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorMsg.style.display = "none";
            submitBtn.disabled = true;
            submitBtn.innerText = "Processing...";

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const username = document.getElementById("username").value.trim();

            const endpoint = isLogin ? "/auth/login" : "/auth/register";
            const payload = { email, password };
            if (!isLogin) {
                payload.username = username;
            }

            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}${endpoint}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    if (isLogin) {
                        const token = await response.text();
                        setToken(token);
                        setUserEmail(email);

                        // Determine user role: from JWT token claim, or email check
                        let role = parseJwtRole(token);
                        if (!role) {
                            if (email.toLowerCase().includes("validator") || (username && username.toLowerCase().includes("validator"))) {
                                role = "VALIDATOR";
                            } else {
                                role = "USER";
                            }
                        }
                        setUserRole(role);

                        showToast("Welcome back! Signing you in...", "success", "Login Successful");

                        setTimeout(() => {
                            if (role === "VALIDATOR" || role === "TRANSACTION_VALIDATOR") {
                                window.location.href = "validator.html";
                            } else {
                                window.location.href = "dashboard.html";
                            }
                        }, 600);
                    } else {
                        showToast("Registration successful! Please log in to your account.", "success", "Welcome");
                        toggleAuth.click();
                    }
                } else {
                    const errMsg = await response.text();
                    errorMsg.innerText = errMsg || "Authentication failed";
                    errorMsg.style.display = "block";
                }
            } catch (error) {
                errorMsg.innerText = "Network error. Make sure the backend is running.";
                errorMsg.style.display = "block";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = isLogin ? "Sign In" : "Register";
            }
        });
    </script>
</body>
</html>
