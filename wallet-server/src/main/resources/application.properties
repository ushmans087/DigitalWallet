spring.application.name=wallet-server

# Eureka service registry
server.port=8086
eureka.client.service-url.defaultZone=http://discovery-server:8082/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# MySQL
spring.datasource.url=jdbc:mysql://mysql:3306/wallet_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# Kafka
spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group-id=wallet-server
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=com.sample.wallet_server.WalletDTO.UserRegisterDTO
spring.kafka.consumer.properties.spring.json.trusted.packages=com.sample.wallet_server.WalletDTO

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379